[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-area-notice"
version = "0.5"
description = "Reference implementation for zone message"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Kurt Schwehr", email = "schwehr@google.com" },
]
maintainers = [
    { name = "Kurt Schwehr", email = "schwehr@gmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["AIS", "binary messages", "NMEA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking",
]
dependencies = [
    "bitvector-modern>=0.0.7",
    "geojson",
    "lxml",
    "pre-commit>=4.6.1",
    "pyproj",
    "shapely",
]

[project.urls]
Homepage = "https://github.com/schwehr/ais-area-notice"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.15.0",
    "pylint",
    "pyrefly",
    "pytest>=8.0.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=5.0.0",
    "semgrep",
    "types-lxml",
    "types-shapely",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.codespell]
skip = "*.pdf"
ignore-words-list = "anc,astroid,pres,tht"

[tool.bandit]
skips = ["B101", "B311"]

[tool.ruff.lint]
ignore = [
    "EXE002",  # The file is executable but no shebang is present
    "F601",  # Dictionary key literal repeated
    "F821",  # Undefined name
]

[tool.coverage.run]
source = ["ais_area_notice", "tests"]
branch = true
omit = [
    "ais_area_notice/build_samples.py",
    "tests/benchmarks_test.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 99.9

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
unresolved-reference = "ignore"
unsupported-operator = "ignore"

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["geojson", "geojson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:doctest --cov --cov-report=term-missing --cov-report=xml"
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.14"
