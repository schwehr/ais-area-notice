[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-area-notice"
version = "0.5"
description = "Reference implementation for zone message"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Kurt Schwehr", email = "schwehr@google.com" },
]
maintainers = [
    { name = "Kurt Schwehr", email = "schwehr@gmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["AIS", "binary messages", "NMEA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking",
]
dependencies = [
    "bitvector-modern>=0.0.7",
    "geojson",
    "lxml",
    "pre-commit>=4.6.1",
    "pyproj",
    "shapely",
]

[project.urls]
Homepage = "https://github.com/schwehr/ais-area-notice"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.15.0",
    "pylint",
    "pyrefly",
    "pytest>=8.0.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=5.0.0",
    "semgrep",
    "types-lxml",
    "types-shapely",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.codespell]
skip = "*.pdf"
ignore-words-list = "anc,astroid,pres,tht"

[tool.bandit]
skips = ["B101", "B311"]

[tool.ruff.lint]
ignore = [
    "B010",  # Do not call setattr with a constant attribute name
    "DTZ001",  # The use of datetime.datetime() without tzinfo argument is not allowed
    "DTZ003",  # The use of datetime.datetime.utcnow() is not allowed
    "DTZ007",  # Naive datetime constructed using strptime() without %z format
    "EXE001",  # Shebang is present but file is not executable
    "EXE002",  # The file is executable but no shebang is present
    "F601",  # Dictionary key literal repeated
    "F821",  # Undefined name
    "I001",  # Import block is unsorted or unformatted
    "ISC004",  # Implicitly concatenated string literals on multiple lines
    "LOG015",  # Root logger call (e.g. logging.info) at module level
    "PERF402",  # Use list copy or list comprehension instead of manual append loop
    "PLR0124",  # Name compared with itself
    "PYI041",  # Use float instead of int | float
    "RET501",  # Do not explicitly return None in function if it can be omitted
    "RUF015",  # Prefer next(iter(...)) over list(...)[0]
    "RUF046",  # Unnecessary cast to int
    "SIM102",  # Use a single if statement instead of nested if statements
    "SIM117",  # Use a single with statement instead of nested with statements
    "SIM118",  # Use key in dict instead of key in dict.keys()
    "UP017",  # Use datetime.UTC alias instead of datetime.timezone.utc
    "UP032",  # Use f-string instead of format call
]

[tool.coverage.run]
source = ["ais_area_notice", "tests"]
branch = true
omit = [
    "ais_area_notice/build_samples.py",
    "ais_area_notice/make_kml_styles.py",
    "tests/benchmarks_test.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 99.9

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
unresolved-reference = "ignore"
unsupported-operator = "ignore"

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["geojson", "geojson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:doctest --cov --cov-report=term-missing --cov-report=xml"
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.14"
