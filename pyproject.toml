[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-area-notice"
version = "0.5"
description = "Reference implementation for zone message"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Kurt Schwehr", email = "schwehr@google.com" },
]
maintainers = [
    { name = "Kurt Schwehr", email = "schwehr@gmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["AIS", "binary messages", "NMEA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking",
]
dependencies = [
    "BitVector",
]

[project.urls]
Homepage = "https://github.com/schwehr/ais-area-notice"
