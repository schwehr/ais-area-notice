[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-area-notice"
version = "0.5"
description = "Reference implementation for zone message"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Kurt Schwehr", email = "schwehr@google.com" },
]
maintainers = [
    { name = "Kurt Schwehr", email = "schwehr@gmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["AIS", "binary messages", "NMEA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking",
]
dependencies = [
    "BitVector",
    "geojson",
    "lxml",
    "pyproj",
    "shapely",
]

[project.urls]
Homepage = "https://github.com/schwehr/ais-area-notice"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.codespell]
skip = "*.pdf"
ignore-words-list = "anc,pres,tht"

[tool.coverage.run]
omit = [
    "ais_area_notice/BitVector.py",
    "ais_area_notice/build_samples.py",
    "ais_area_notice/make_kml_styles.py",
]

[tool.coverage.report]
show_missing = true
