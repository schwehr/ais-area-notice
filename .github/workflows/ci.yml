name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        if: matrix.os == 'ubuntu-latest'
        run: SKIP=mypy,lychee uv run pre-commit run --all-files

      - name: Run tests (with coverage)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest --benchmark-skip

      - name: Run tests (without coverage)
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest --benchmark-skip --no-cov

      - name: Write coverage report to Job Summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "### Test Coverage Report (Python 3.14)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown --fail-under=99.9 >> $GITHUB_STEP_SUMMARY

  benchmark:
    name: "Benchmarks (Linux Python 3.14)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run benchmark tests
        run: uv run pytest --benchmark-only --no-cov
