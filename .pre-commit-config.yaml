repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.56
    hooks:
      - id: ty

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pytest
          - pytest-benchmark
          - types-lxml
          - types-shapely

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.1.1
    hooks:
      - id: pyrefly-check
        pass_filenames: false
        additional_dependencies:
          - bitvector-modern
          - geojson
          - lxml
          - pyproj
          - pytest
          - pytest-benchmark
          - shapely
          - types-lxml
          - types-shapely

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "80"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--ignore-words-list=anc,pres,tht", "--skip=*.pdf"]

  - repo: local
    hooks:
      - id: check-uv-lock-public-index
        name: Check uv.lock for internal proxy links
        entry: airlock-proxy\.uplink\.goog
        language: pygrep
        files: ^uv\.lock$
