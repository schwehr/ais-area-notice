repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.56
    hooks:
      - id: ty

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pytest
          - pytest-benchmark
          - types-lxml
          - types-shapely

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.1.1
    hooks:
      - id: pyrefly-check
        pass_filenames: false
        additional_dependencies:
          - bitvector-modern
          - geojson
          - lxml
          - pyproj
          - pytest
          - pytest-benchmark
          - shapely
          - types-lxml
          - types-shapely

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.3.4
    hooks:
      - id: pylint
        args:
          - "--fail-under=9.0"
          - "--disable=abstract-method,attribute-defined-outside-init,bare-except,expression-not-assigned,fixme,global-statement,pointless-string-statement,raise-missing-from,redefined-builtin,redefined-outer-name,reimported,super-init-not-called,unspecified-encoding,unused-argument,unused-import,unused-variable,invalid-name,missing-function-docstring,import-outside-toplevel,unnecessary-comprehension,missing-class-docstring,too-many-lines,too-many-branches,wrong-import-order,chained-comparison,consider-using-f-string,no-else-return,too-many-positional-arguments,consider-merging-isinstance,consider-using-enumerate,too-few-public-methods,comparison-with-itself,consider-using-dict-items,inconsistent-return-statements,undefined-variable,unnecessary-dunder-call,too-many-instance-attributes,too-many-arguments,too-many-locals,potential-index-error,consider-using-with,no-member,missing-module-docstring,line-too-long,deprecated-module,invalid-unary-operand-type,too-many-statements,consider-using-generator,too-many-return-statements,singleton-comparison,too-many-public-methods,unbalanced-tuple-unpacking,superfluous-parens,no-else-continue,useless-return,wrong-import-position,duplicate-code"
        additional_dependencies:
          - bitvector-modern
          - geojson
          - lxml
          - pyproj
          - pytest
          - shapely

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "80"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--ignore-words-list=anc,astroid,pres,tht", "--skip=*.pdf"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.170.0
    hooks:
      - id: semgrep
        args: [--config, p/default]

  - repo: local
    hooks:
      - id: check-uv-lock-public-index
        name: Check uv.lock for internal proxy links
        entry: airlock-proxy\.uplink\.goog
        language: pygrep
        files: ^uv\.lock$
